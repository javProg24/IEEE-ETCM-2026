<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">


<section id="ieee-revisores">

  <div class="ir-header">
    <p class="ir-sub">Browse the list of reviewers who take part in the conference's peer-review process.</p>
  </div>

  <div class="ir-searchbar">
    <div class="ir-search-form" id="ir-form">
      <input type="text" id="ir-input" placeholder="E.g. Acosta, Universidad de Las Américas…" autocomplete="off">
      <button type="button" id="ir-btn-search">Search</button>
    </div>
  </div>

  <div class="ir-meta-row">
    <span class="ir-count">Showing <strong id="ir-count-num">0</strong> of <strong id="ir-count-total">0</strong> reviewers</span>
    <span id="ir-query-echo"></span>
  </div>

  <div class="ir-table-wrap">
    <table class="ir-table">
      <thead>
        <tr>
          <th>Full name</th>
          <th>Affiliation</th>
          <th>Country</th>
        </tr>
      </thead>
      <tbody id="ir-results"></tbody>
    </table>
  </div>

  <div class="ir-pagination" id="ir-pagination"></div>

</section>

<script src="revisores-data.js"></script>
<script src="script.js"></script>
