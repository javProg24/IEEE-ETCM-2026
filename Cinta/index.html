<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinta de Logos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="banner">
        <div class="banner-track">
            <div class="banner-content">
                <div class="event-info">
                    <img src="/images/logo/etcm.jpeg" alt="IEEE ETCM 2026" class="event-logo">
                </div>
                <div class="organizers">
                    <div class="org-section">
                        <h3>Organized by:</h3>
                        <img src="/images/logo/ieee.png" alt="IEEE Ecuador">
                    </div>
                    <div class="org-section">
                        <h3>Co-organized with:</h3>
                        <div class="co-org-logos">
                            <img src="/images/logo/LOGO ITB UNIVERSITARIO (1).png" alt="Instituto Bolivariano">
                            <img src="/images/logo/LOGO UBE ROJO PARA FONDO BLANCO.png" alt="Universidad Bolivariana">
                        </div>
                    </div>
                    <div class="org-section chapters-section">
                        <h3>Supported by Ecuadorian Chapters:</h3>
                        <div class="chapter-logos">
                            <img src="../images/logo/logo-CAS-EDS-EC-color.png" alt="CAS EDS Ecuador Chapter">
                            <img src="../images/logo/logo-CIS-EC-color.png" alt="CIS Ecuador Chapter">
                            <img src="../images/logo/logo-ComSoc-EC-color.png" alt="ComSoc Ecuador Chapter">
                            <img src="../images/logo/logo-CS-EC-color.png" alt="CS Ecuador Chapter">
                            <img src="../images/logo/logo-CSS-IES-EC-color.png" alt="CSS IES Ecuador Chapter">
                            <img src="../images/logo/logo-EdSoc-EC-color.png" alt="EdSoc Ecuador Chapter">
                            <img src="../images/logo/logo-EMBS-EC-color.png" alt="EMBS Ecuador Chapter">
                            <img src="../images/logo/logo-IAS-RS-EC-color.png" alt="IAS RS Ecuador Chapter">
                            <img src="../images/logo/logo-PES-EC-color.png" alt="PES Ecuador Chapter">
                            <img src="../images/logo/logo-RAS-EC-color.png" alt="RAS Ecuador Chapter">
                            <img src="../images/logo/logo-TEMS-EC-color.png" alt="TEMS Ecuador Chapter">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="banner-stripe"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
