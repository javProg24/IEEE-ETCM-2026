<style>
  .ks-clean{
    max-width: 1160px;
    margin: 0 auto;
    padding: 30px 20px 50px;
    font-family: Arial, Helvetica, sans-serif;
  }

  .ks-clean-title{
    text-align: center;
    font-size: 34px;
    font-weight: 800;
    color: #0f172a;
    margin: 0 0 10px;
  }

  .ks-clean-subtitle{
    text-align: center;
    font-size: 15px;
    color: #64748b;
    max-width: 720px;
    margin: 0 auto 34px;
    line-height: 1.7;
  }

  .ks-clean-grid{
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 18px;
    row-gap: 24px;
    align-items: start;
  }

  .ks-clean-item{
    display: block;
  }

  .ks-clean-item.is-open{
    grid-column: span 2;
  }

  .ks-clean-shell{
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    transition:
      grid-template-columns .85s cubic-bezier(.16, 1, .3, 1),
      gap .75s cubic-bezier(.16, 1, .3, 1);
    will-change: grid-template-columns;
  }

  .ks-clean-item.is-open .ks-clean-shell{
    grid-template-columns: 430px 1fr;
    gap: 24px;
    align-items: stretch;
  }

  .ks-clean-card{
    background: #fff;
    border: 1px solid #dbe3ee;
    border-radius: 20px;
    box-shadow: 0 8px 22px rgba(15,23,42,.05);
    transition:
      transform .55s cubic-bezier(.16, 1, .3, 1),
      box-shadow .55s ease,
      border-color .55s ease;
    cursor: pointer;
    will-change: transform;
  }

  .ks-clean-card:hover{
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(15,23,42,.08);
  }

  .ks-clean-item.is-open .ks-clean-card{
    border-color: #bfdbfe;
    box-shadow: 0 16px 34px rgba(15,23,42,.10);
  }

  .ks-clean-card-top{
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 26px 24px;
  }

  .ks-clean-photo{
    width: 160px;
    height: 160px;
    flex: 0 0 160px;
    border-radius: 20px;
    overflow: hidden;
    background: #e5e7eb;
  }

  .ks-clean-photo img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .ks-clean-head{
    flex: 1;
    min-width: 0;
  }

  .ks-clean-name{
    margin: 0 0 5px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 800;
    color: #0f172a;
  }

  .ks-clean-role{
    margin: 0;
    font-size: 15px;
    line-height: 1.4;
    color: #64748b;
  }

  .ks-clean-toggle{
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: 50%;
    border: 1px solid #cfe0ff;
    background: #f8fbff;
    color: #2563eb;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    transition:
      transform .55s cubic-bezier(.16, 1, .3, 1),
      background .45s ease;
  }

  .ks-clean-item.is-open .ks-clean-toggle{
    transform: rotate(45deg);
    background: #eff6ff;
  }

  .ks-clean-panel{
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transform: translateX(-18px);
    visibility: hidden;
    pointer-events: none;

    background: #fff;
    border: 0 solid #dbe3ee;
    border-radius: 20px;
    box-shadow: 0 10px 28px rgba(15,23,42,.06);
    padding: 0 24px;

    transition:
      max-height .85s cubic-bezier(.16, 1, .3, 1),
      padding .75s ease,
      border-width .45s ease,
      opacity .75s ease,
      transform .85s cubic-bezier(.16, 1, .3, 1),
      visibility .75s ease;
  }

  .ks-clean-item.is-open .ks-clean-panel{
    max-height: 420px;
    opacity: 1;
    transform: translateX(0);
    visibility: visible;
    pointer-events: auto;
    border-width: 1px;
    padding: 24px 26px;
  }

  .ks-clean-bio{
    margin: 0;
    font-size: 15px;
    line-height: 1.85;
    color: #475569;
    text-align: justify;
  }

  @media (max-width: 991px){
    .ks-clean-grid{
      grid-template-columns: 1fr;
      row-gap: 18px;
    }

    .ks-clean-item.is-open{
      grid-column: span 1;
    }

    .ks-clean-item.is-open .ks-clean-shell{
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .ks-clean-panel{
      transform: translateY(-10px);
      padding: 0 18px;
    }

    .ks-clean-item.is-open .ks-clean-panel{
      max-height: 700px;
      transform: translateY(0);
      padding: 20px 18px;
    }
  }

  @media (max-width: 640px){
    .ks-clean{
      padding: 20px 14px 36px;
    }

    .ks-clean-title{
      font-size: 28px;
    }

    .ks-clean-subtitle{
      font-size: 14px;
      margin-bottom: 26px;
    }

    .ks-clean-card-top{
      padding: 18px 16px;
      gap: 16px;
    }

    .ks-clean-photo{
      width: 120px;
      height: 120px;
      flex: 0 0 120px;
      border-radius: 17px;
    }

    .ks-clean-name{
      font-size: 18px;
    }

    .ks-clean-role{
      font-size: 13px;
    }

    .ks-clean-toggle{
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      font-size: 16px;
    }

    .ks-clean-bio{
      font-size: 13.8px;
      line-height: 1.75;
    }
  }
</style>

<div class="ks-clean">
  <h2 class="ks-clean-title">Keynote Speakers</h2>
  <p class="ks-clean-subtitle">
    Click on each speaker to expand the profile horizontally in desktop and vertically on mobile.
  </p>

  <div class="ks-clean-grid" id="ksCleanGrid"></div>
</div>

<script>
  (function () {
    const speakers = [
      {
        nombre: "Daniel Campos Delgado",
        cargoCorto: "Professor · UASLP, Mexico",
        foto: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800&auto=format&fit=crop",
        bio: "Daniel Campos Delgado is a distinguished researcher whose work focuses on control systems, intelligent automation and advanced engineering applications. His keynote addresses emerging challenges in applied research, innovation and technological development for future-oriented engineering solutions."
      },
      {
        nombre: "Bikash Pal",
        cargoCorto: "Professor · Imperial College London",
        foto: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800&auto=format&fit=crop",
        bio: "Bikash Pal has contributed significantly to power systems, system dynamics and renewable energy integration. His keynote provides a strong academic and practical perspective on resilient infrastructures, sustainable energy systems and intelligent engineering strategies."
      },
      {
        nombre: "María Fernanda López",
        cargoCorto: "Researcher · Smart Systems Institute",
        foto: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=800&auto=format&fit=crop",
        bio: "María Fernanda López specializes in digital transformation, smart systems and interdisciplinary innovation. Her keynote emphasizes how technology, research and collaboration can strengthen engineering education and scientific impact in contemporary environments."
      },
      {
        nombre: "Andrés Villacís",
        cargoCorto: "Professor · Advanced Energy Lab",
        foto: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?q=80&w=800&auto=format&fit=crop",
        bio: "Andrés Villacís works on smart grids, industrial energy systems and modern infrastructure optimization. His keynote contributes a practical and strategic view of current energy, sustainability and technology challenges in engineering."
      }
    ];

    const grid = document.getElementById("ksCleanGrid");

    function createSpeaker(speaker, index) {
      const item = document.createElement("div");
      item.className = "ks-clean-item";
      item.dataset.index = index;

      item.innerHTML = `
        <div class="ks-clean-shell">
          <div class="ks-clean-card">
            <div class="ks-clean-card-top">
              <div class="ks-clean-photo">
                <img src="${speaker.foto}" alt="${speaker.nombre}">
              </div>

              <div class="ks-clean-head">
                <h3 class="ks-clean-name">${speaker.nombre}</h3>
                <p class="ks-clean-role">${speaker.cargoCorto}</p>
              </div>

              <div class="ks-clean-toggle">+</div>
            </div>
          </div>

          <div class="ks-clean-panel">
            <p class="ks-clean-bio">${speaker.bio}</p>
          </div>
        </div>
      `;

      const card = item.querySelector(".ks-clean-card");

      card.addEventListener("click", function () {
        const isOpen = item.classList.contains("is-open");

        document.querySelectorAll(".ks-clean-item").forEach((other) => {
          other.classList.remove("is-open");
        });

        if (!isOpen) {
          item.classList.add("is-open");
        }
      });

      return item;
    }

    speakers.forEach((speaker, index) => {
      grid.appendChild(createSpeaker(speaker, index));
    });
  })();
</script>
