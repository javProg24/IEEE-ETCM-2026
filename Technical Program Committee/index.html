<style>
    .tpc-fragment,
    .tpc-fragment * {
        box-sizing: border-box;
    }

    .tpc-fragment {
        --bg: #f4f1eb;
        --surface: rgba(255, 255, 255, 0.82);
        --surface-strong: #ffffff;
        --border: rgba(44, 62, 80, 0.08);
        --text: #18212b;
        --muted: #66707a;
        --accent: #254f6b;
        --shadow: 0 18px 50px rgba(24, 33, 43, 0.08);
        font-family: "Segoe UI", Arial, sans-serif;
        line-height: 1.6;
        color: var(--text);
        background:
            radial-gradient(circle at top left, rgba(37, 79, 107, 0.12), transparent 32%),
            linear-gradient(180deg, #f7f3ee 0%, var(--bg) 100%);
        padding: 40px 20px 56px;
    }

    .tpc-fragment .tpc-wrap {
        max-width: 1580px;
        margin: 0 auto;
        background: var(--surface);
        backdrop-filter: blur(10px);
        padding: 48px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow: var(--shadow);
    }

    .tpc-fragment .tpc-section {
        margin-bottom: 36px;
    }

    .tpc-fragment .tpc-section:last-child {
        margin-bottom: 0;
    }

    .tpc-fragment h2 {
        margin: 0 0 18px;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }

    .tpc-fragment ul {
        list-style: none;
        display: grid;
        gap: 18px;
        margin: 0;
        padding: 0;
    }

    .tpc-fragment li {
        background: rgba(255, 255, 255, 0.58);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 22px;
    }

    .tpc-fragment .track-name {
        display: block;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--text);
        margin-bottom: 14px;
        letter-spacing: -0.01em;
    }

    .tpc-fragment .person-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
    }

    .tpc-fragment .person-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 10px 24px rgba(24, 33, 43, 0.05);
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: left;
    }

    .tpc-fragment .person-card h3 {
        margin: 0 0 8px;
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.35;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .tpc-fragment .scholar-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        text-decoration: none;
    }

    .tpc-fragment .scholar-badge img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .tpc-fragment .person-card p {
        margin: 0;
        font-size: 0.94rem;
        color: var(--muted);
        line-height: 1.55;
    }

    @media (max-width: 768px) {
        .tpc-fragment .tpc-wrap {
            padding: 30px 20px;
        }

        .tpc-fragment li {
            padding: 18px;
        }
    }
</style>

<section class="tpc-fragment">
    <div class="tpc-wrap" id="tpc-root"></div>
</section>

<script src="script.js"></script>
