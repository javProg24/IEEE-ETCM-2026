<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">


<section id="ieee-catalogo">

  <div class="ic-header">
    <h2 class="ic-title">Scientific Articles Catalog</h2>
    <p class="ic-sub">Search by title, author, keyword, or topic among the conference's indexed publications.</p>
  </div>

  <div class="ic-searchbar">
    <div class="ic-search-form" id="ic-form">
      <input type="text" id="ic-input" placeholder="E.g. neural networks, Ochoa, renewable energy…" autocomplete="off">
      <button type="button" id="ic-btn-search">Search</button>
    </div>
    <div class="ic-filters">
      <label for="ic-track-filter">Track</label>
      <select id="ic-track-filter">
        <option value="">All tracks</option>
      </select>
    </div>
  </div>

  <div class="ic-meta-row">
    <span class="ic-count">Showing <strong id="ic-count-num">0</strong> of <strong id="ic-count-total">0</strong> articles</span>
    <span id="ic-query-echo"></span>
  </div>

  <div class="ic-results" id="ic-results"></div>

  <div class="ic-pagination" id="ic-pagination"></div>

</section>

<script src="articulos-data.js"></script>
<script src="script.js"></script>
