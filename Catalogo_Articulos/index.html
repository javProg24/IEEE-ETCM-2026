<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">


<section id="ieee-catalogo">

  <div class="ic-header">
    <h2 class="ic-title">Catálogo de artículos científicos</h2>
    <p class="ic-sub">Busca por título, autor, palabra clave o tema dentro de las publicaciones indexadas del congreso.</p>
  </div>

  <div class="ic-searchbar">
    <div class="ic-search-form" id="ic-form">
      <input type="text" id="ic-input" placeholder="Ej: redes neuronales, Ochoa, energía renovable…" autocomplete="off">
      <button type="button" id="ic-btn-buscar">Buscar</button>
    </div>
    <div class="ic-filters">
      <label for="ic-track-filter">Track</label>
      <select id="ic-track-filter">
        <option value="">Todos los tracks</option>
      </select>
    </div>
  </div>

  <div class="ic-meta-row">
    <span class="ic-count">Mostrando <strong id="ic-count-num">0</strong> de <strong id="ic-count-total">0</strong> artículos</span>
    <span id="ic-query-echo"></span>
  </div>

  <div class="ic-results" id="ic-results"></div>

  <div class="ic-pagination" id="ic-pagination"></div>

</section>

<script src="articulos-data.js"></script>
<script src="script.js"></script>
